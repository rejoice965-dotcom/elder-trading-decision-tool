# ===== 风控 =====
risk:
  - id: RISK-01
    name: "2% 法则"
    formula: "max_risk=equity*risk_per_trade; size=max_risk/(entry-stop)"
    params_ref: [risk_per_trade]
    rule: "先定止损距离，再算仓位；顺序不能反"
    confidence: A
    source_ids: [S2]
    source_quote: "Never risk more than 2% of total trading capital on a single trade."
    book_confirmed: "第2版"
    book_edition: "《以交易为生》（原书第2版），[美]亚历山大·埃尔德（Alexander Elder）著，熊振华译，机械工业出版社 2017.6 第1版（2020.6 第8次印刷），ISBN 978-7-111-56972-5"
    book_chapter: ["第9章 风险管理 · 第50节 2%法则"]
    book_page: ["p.296", "p.298"]
    book_quote: ["2%原则会防止你的账户在单次交易中出现本金亏损2%以上的风险。", "将A除以B，得到所能交易的最大股数。"]
    source_page: "p.296, p.298"
    status: implement
  - id: RISK-02
    name: "6% 法则"
    formula: "if (month_open-equity) > monthly_drawdown_limit*month_open: halt(rest_of_month)"
    params_ref: [monthly_drawdown_limit]
    rule: "月度回撤超限则当月停止交易。第2版还将当月损失与持仓头寸风险额度之和计入 6% 限额；按用户决定维持现状。"
    confidence: A
    source_ids: [S2]
    source_quote: "If the account falls 6% below its monthly opening balance, stop trading for the rest of that month."
    book_confirmed: "第2版"
    book_edition: "《以交易为生》（原书第2版），[美]亚历山大·埃尔德（Alexander Elder）著，熊振华译，机械工业出版社 2017.6 第1版（2020.6 第8次印刷），ISBN 978-7-111-56972-5"
    book_chapter: ["第9章 风险管理 · 第51节 6%法则"]
    book_page: ["p.302", "p.304"]
    book_quote: ["6%原则能给每一个账户都设了一个当月最大回撤比例。", "如果两者之和已经超过你月初账户资产的6%时，这个月剩下的时间你都不能再增加交易头寸了"]
    source_page: "p.302, p.304"
    status: implement
  - id: RISK-03
    name: "50% 法则"
    formula: "stop=entry+profit_protect_ratio*(best_price-entry)"
    params_ref: [profit_protect_ratio]
    rule: "有浮盈后把止损移到保住一半利润的位置"
    confidence: A
    source_ids: [S2]
    source_quote: "the stop is moved to a level that protects at least half the paper gain"
    source_page: null
    status: implement

