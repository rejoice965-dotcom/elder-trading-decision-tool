# 指标规格 v1.0 — 机器可读事实源（P0 产出）
# 基于公开资料交叉核对重建。已确认条目填第2版真实页码，其余 source_page 为 null；禁止编造。
# 代码只允许从本文件的 params: 读取参数，禁止硬编码周期数字。

meta:
  spec_version: "1.0"
  source_doc: "INDICATOR_SPEC.md"
  human_doc: "docs/INDICATORS.md"
  provenance: "公开资料交叉核对重建，非原书直引"
  source_page_policy: "已确认条目填写第2版真实页码，其余为 null；禁止编造章节号/页码/引文"
  generated_by: "WorkBuddy 代跑 P0（本机 Codex CLI 受执行环境沙箱限制，未能写文件）"
  counts: { total: 21, A: 15, B: 4, C: 2 }

# ===== 唯一参数入口 =====
params:
  ema_period: 13                 # 备选 26
  macd_fast: 12                  # 备选 11
  macd_slow: 26                  # 备选 25
  macd_signal: 9                 # 备选 8
  fi_ema: 2                      # 备选 13（中线）/ 1（原始值）
  rsi_period: 14                 # 第2版建议 7-9，另有 13 日示例；按决定保持 14
  stoch_k: 13                    # 备选 14
  stoch_d: 3                     # 备选 5
  oversold: 30
  overbought: 70
  tf_high: "1w"
  tf_mid: "1d"
  tf_low: "60m"
  tf_ratio: 5
  breakout_offset_ticks: 1
  risk_per_trade: 0.02
  monthly_drawdown_limit: 0.06
  profit_protect_ratio: 0.50

# ===== A 股市场配置（2026-11-20 用户确认目标市场）=====
market:
  name: "A-share"
  data_source: "akshare"        # 备选 baostock / tushare / csv
  adjust: "qfq"                 # 指标使用前复权数据
  adjustment_tracks:
    indicators: "qfq"
    execution: "none"
    limit_validation: "none"
  symbol_format: "600519.SH"    # 6 位代码 + 交易所后缀
  t_plus_1: true
  cash_only: true
  allow_short: false
  board_limit_pct:
    main_board: 0.10
    chinext: 0.20
    star_market: 0.20
    beijing_stock_exchange: 0.30
    st: 0.05
  board_code_prefixes:
    main_board: ["600", "601", "603", "605", "000", "001", "002", "003"]
    chinext: ["300", "301"]
    star_market: ["688", "689"]
    beijing_stock_exchange: ["4", "8", "920"]
  min_lot: 100
  price_tick: 0.01
  trading_calendar: "SSE"
  calendar_name: "XSHG"
  week_starting_day: "MON"
  week_ending_day: "FRI"
  intraday_bars_per_day: 4      # 每日 4 根 60 分钟 K
  intraday_bar_close_times: ["10:30", "11:30", "14:00", "15:00"]
  skip_suspended: true
  trading_sessions:
    morning_open: "09:30"
    morning_close: "11:30"
    afternoon_open: "13:00"
    afternoon_close: "15:00"
  resume_signal_policy:
    first_60m_bar_must_be_closed: true
    skip_suspended_session: true
  cache:
    format: "csv"
    directory: "data/cache"
  data_date_policy: "Store fetch timestamp and requested start/end dates in each cache sidecar."

sources:
  S1: "https://cmtassociation.org/wp-content/uploads/2025/08/MTA04May.pdf"
  S2: "https://www.marketsfn.com/book/trading-for-a-living"
  S3: "https://forestbergen.com/portfolio-item/join-dr-alexander-elder-in-his-trading-room"
  S4: "微信公号《以交易为生》全书指标梳理（二手整理，无可核验 URL）"
  S5: "https://aloycwl.blogspot.com/2022/03/trading-for-living-alexander-elder-1993.html"
  S6: "https://www.freqtrade.io/en/stable/plotting/"

# ===== 系统规则 =====
systems:
  - id: SYS-01
    name: "三重滤网 Triple Screen"
    formula: "screen1(tf_high) -> screen2(tf_mid) -> screen3(tf_low)"
    inputs: [open, high, low, close, volume]
    rule: "三层全部为真才产生信号"
    confidence: A
    source_ids: [S1, S2]
    source_quote: "In his first book, 'Trading for a Living,' Elder defined his Triple Screen Trading System."
    book_confirmed: "第2版"
    book_edition: "《以交易为生》（原书第2版），[美]亚历山大·埃尔德（Alexander Elder）著，熊振华译，机械工业出版社 2017.6 第1版（2020.6 第8次印刷），ISBN 978-7-111-56972-5"
    book_chapter: ["第7章 交易系统 · 第39节 三重滤网交易系统"]
    book_page: ["p.224"]
    book_quote: ["它最基本的原理一直保持不变：使用多重时间周期和技术指标进行交易决策。"]
    source_page: "p.224"
    status: implement
  - id: SYS-02
    name: "方向铁律"
    formula: "direction==LONG -> allowed={LONG}; SHORT -> allowed={SHORT}; FLAT -> allowed={}"
    inputs: [direction]
    rule: "第1重方向为严格开关，逆势信号一律丢弃；EMA 走平不交易"
    confidence: A
    source_ids: [S1]
    source_quote: "Screen one is strict filter: no exceptions."
    book_confirmed: "第2版"
    book_edition: "《以交易为生》（原书第2版），[美]亚历山大·埃尔德（Alexander Elder）著，熊振华译，机械工业出版社 2017.6 第1版（2020.6 第8次印刷），ISBN 978-7-111-56972-5"
    book_chapter: ["第7章 交易系统 · 第39节 第一重滤网总结", "第4章 计算机化的技术分析 · 第22节 移动平均 · 交易规则"]
    book_page: ["p.229", "p.113"]
    book_quote: ["在上升的趋势里只允许你选择买入或者观望；在下跌的趋势里只允许你卖出或观望。", "当EMA走平，只是小幅波动时，那意味着一种漫无目的、没有趋势的市场。这种情况下不要使用趋势跟随方法。"]
    source_page: "p.229, p.113"
    status: implement
  - id: SYS-03
    name: "第1重 周线定方向"
    formula: "ema_slope=EMA(close,13)-EMA(close,13).shift(1); hist_slope=macdhist-macdhist.shift(1); 两者同号定方向，冲突则 FLAT"
    inputs: [close]
    rule: "ema_slope>0 且 hist_slope>0 -> LONG；均<0 -> SHORT；否则 FLAT"
    confidence: A
    source_ids: [S1, S2]
    source_quote: "Elder showed that a trader could use the slope of the two most recent bars on a MACD histogram to determine the trend."
    book_confirmed: "第2版"
    book_edition: "《以交易为生》（原书第2版），[美]亚历山大·埃尔德（Alexander Elder）著，熊振华译，机械工业出版社 2017.6 第1版（2020.6 第8次印刷），ISBN 978-7-111-56972-5"
    book_chapter: ["第7章 交易系统 · 第39节 第一重滤网——市场潮流"]
    book_page: ["p.228"]
    book_quote: ["MACD的斜率由最近两根MACD柱线之间的关系确定。"]
    source_page: "p.228"
    status: implement
  - id: SYS-04
    name: "第2重 日线找逆势回调"
    formula: >-
      LONG: (bear_power < 0 and bear_power > previous_bear_power) or K <= oversold or RSI <= oversold.
      SHORT: (bull_power > 0 and bull_power < previous_bull_power) or K >= overbought or RSI >= overbought.
    params_ref: [ema_period, rsi_period, stoch_k, oversold, overbought]
    inputs: [close, high, low]
    rule: "使用 T-1 已收盘前复权日线。同方向三者任一成立即 setup，FLAT 无 setup。简化条件基于 S1 任选振荡器的思路。"
    confidence: A
    source_ids: [S1]
    source_quote: "oscillator divergences are used to buy short-term weakness in uptrends, or to sell short-term strength in downtrends"
    book_confirmed: "第2版"
    book_edition: "《以交易为生》（原书第2版），[美]亚历山大·埃尔德（Alexander Elder）著，熊振华译，机械工业出版社 2017.6 第1版（2020.6 第8次印刷），ISBN 978-7-111-56972-5"
    book_chapter: ["第7章 交易系统 · 第39节 第二重滤网——市场浪涛", "第4章 计算机化的技术分析 · 第26节 随机指标 · 「交易规则」"]
    book_page: ["p.229", "p.230", "p.143"]
    book_quote: ["将震荡指标应用于日线图之中。", "当周趋势是上升的，三重滤网仅允许采用日线图震荡指标发出的买入信号，而不会允许采用其发出的卖出信号。", "三重滤网交易系统只有当周趋势向上时，随机指标给出的买入信号才会被采用。"]
    source_page: "p.229, p.230, p.143"
    status: implement
    notes: "第2版 p.167「2日EMA可以很好地与三重滤网交易系统（见第39节）相适应。」p.229「将震荡指标应用于日线图之中。」按用户决定保留当前三选一 setup，Force Index 触发为 optional。"
  - id: SYS-05
    name: "第3重 盘中挂单择时"
    formula: "buy_stop=high_raw[T-1]+offset, sell_stop=low_raw[T-1]-offset, offset=breakout_offset_ticks*price_tick"
    inputs: [high_raw, low_raw, close_raw]
    rule: "T-1 是信号日前一交易日。原始参照字段直接记录 T-1 的 raw 价格。已收盘 60 分钟 K 达到阈值时产生候选信号。BUY 保护止损参考 T-1 raw 低点，SELL 参考 T-1 raw 高点。"
    confidence: A
    source_ids: [S1]
    source_quote: "a buy stop order to catch an upside breakout by buying at the previous day's high"
    book_confirmed: "第2版"
    book_edition: "《以交易为生》（原书第2版），[美]亚历山大·埃尔德（Alexander Elder）著，熊振华译，机械工业出版社 2017.6 第1版（2020.6 第8次印刷），ISBN 978-7-111-56972-5"
    book_chapter: ["第7章 交易系统 · 第39节 第三重滤网——买入技术"]
    book_page: ["p.231", "p.236", "p.232"]
    book_quote: ["做多时，在日线向上突破前一交易日高点的时候买入；卖空时，在日线向下突破前一交易日低点的时候卖出。", "三重滤网交易系统需要设置相对保守的止损价位。", "突破技术仍然是有效的，但是我很少使用它了。"]
    source_page: "p.231, p.236, p.232"
    status: implement

# ===== 指标 =====
indicators:
  - id: IND-01
    name: "EMA 指数移动平均"
    formula: "EMA(close, n)"
    params_ref: [ema_period]
    inputs: [close]
    layer: "trend/screen1"
    rule: "斜率>0 多头；<0 空头；≈0 观望"
    confidence: A
    source_ids: [S1, S2]
    source_quote: "A rising EMA confirms a bull market; a falling EMA confirms a bear market."
    book_confirmed: "第2版"
    book_edition: "《以交易为生》（原书第2版），[美]亚历山大·埃尔德（Alexander Elder）著，熊振华译，机械工业出版社 2017.6 第1版（2020.6 第8次印刷），ISBN 978-7-111-56972-5"
    book_chapter: ["第4章 计算机化的技术分析 · 第22节 移动平均 · 「选择移动平均的长度」"]
    book_page: ["p.111", "p.115", "p.110"]
    book_quote: ["监控EMA的斜率是很有益的，因为上升的斜率意味着上涨趋势，而下降的斜率意味着下跌趋势。", "使用26周和13周的EMA来分析周线图，或者22日和11日的EMA来分析日线图。", "指数移动平均（以下简称EMA）是一种更好的趋势跟随指标"]
    source_page: "p.111, p.115, p.110"
    status: implement
  - id: IND-02
    name: "MACD 线 + 柱状图"
    formula: "macd=EMA(close,fast)-EMA(close,slow); signal=EMA(macd,signal); hist=macd-signal"
    params_ref: [macd_fast, macd_slow, macd_signal]
    inputs: [close]
    layer: "trend+oscillator/screen1+2"
    rule: "hist 斜率转折，或 hist 与价格背离 -> 力量转折信号"
    confidence: A
    source_ids: [S1, S2]
    source_quote: "The slope of the histogram — not its absolute level — is the primary signal."
    book_confirmed: "第2版"
    book_edition: "《以交易为生》（原书第2版），[美]亚历山大·埃尔德（Alexander Elder）著，熊振华译，机械工业出版社 2017.6 第1版（2020.6 第8次印刷），ISBN 978-7-111-56972-5"
    book_chapter: ["第4章 计算机化的技术分析 · 第23节 MACD 线和 MACD 柱状线 · 背离"]
    book_page: ["p.127", "p.129", "p.128"]
    book_quote: ["当MACD柱状线从第二个底部开始反转时，它就发出了买入的信号。", "当MACD柱状线从第二个顶点开始下降时，就已经是卖出的信号了。", "26日和13日指数移动平均线，12-26-9MACD线和柱状图"]
    source_page: "p.127, p.129, p.128"
    status: implement
  - id: IND-03
    name: "Force Index 强力指数"
    formula: "fi=(close-close.shift(1))*volume; out=EMA(fi, fi_ema)"
    params_ref: [fi_ema]
    inputs: [close, volume]
    layer: "oscillator/screen2"
    rule: "计算后随信号输出，Force Index 背离为 optional"
    confidence: A
    source_ids: [S1, S2]
    source_quote: "Force Index is calculated by subtracting yesterday's close from today's close and multiplying that by today's volume."
    book_confirmed: "第2版"
    book_edition: "《以交易为生》（原书第2版），[美]亚历山大·埃尔德（Alexander Elder）著，熊振华译，机械工业出版社 2017.6 第1版（2020.6 第8次印刷），ISBN 978-7-111-56972-5"
    book_chapter: ["第5章 成交量和时间 · 第30节 强力指数指标 · 「如何构造强力指数指标」"]
    book_page: ["p.163", "p.167"]
    book_quote: ["强力指数指标＝今日成交量×（今日收盘价－昨日收盘价）", "2日EMA可以很好地与三重滤网交易系统（见第39节）相适应。", "当13日EMA穿越到中心线上方时，表明多头占据优势，此时是买入时机"]
    source_page: "p.163, p.167"
    status: implement
  - id: IND-04
    name: "Elder-Ray 埃尔德射线"
    formula: "bull=high-EMA(close,13); bear=low-EMA(close,13)"
    params_ref: [ema_period]
    inputs: [high, low, close]
    layer: "oscillator/screen2"
    rule: "LONG 时 Bear Power 为负且回升。SHORT 时 Bull Power 为正且回落。"
    confidence: A
    source_ids: [S1, S2]
    source_quote: "Elder Ray consists of two measures - Bull Power and Bear Power."
    source_page: null
    status: implement
  - id: IND-05
    name: "Stochastic K/D"
    formula: "K=100*(close-LLV(low,k))/(HHV(high,k)-LLV(low,k)); D=SMA(K,d)"
    params_ref: [stoch_k, stoch_d, oversold, overbought]
    inputs: [high, low, close]
    layer: "oscillator/screen2"
    rule: "LONG 时 K <= oversold，SHORT 时 K >= overbought。穿回阈值为 optional。第2版标准 %K 时间跨度为 5 天；按用户决定保持 stoch_k=13。"
    confidence: A
    source_ids: [S1]
    source_quote: "Elder suggests Force Index (2-day EMA), Elder-Ray (bull/bear power), or 13-day Stochastic."
    book_confirmed: "第2版"
    book_edition: "《以交易为生》（原书第2版），[美]亚历山大·埃尔德（Alexander Elder）著，熊振华译，机械工业出版社 2017.6 第1版（2020.6 第8次印刷），ISBN 978-7-111-56972-5"
    book_chapter: ["第4章 计算机化的技术分析 · 第26节 随机指标"]
    book_page: ["p.139", "p.141"]
    book_quote: ["随机指标的标准时间跨度是5天，虽然有些交易者会用更多的天数。", "随机指标的取值范围是0～100。通常在20%和80%的地方画参考线，标识出超买和超卖的区域。"]
    source_page: "p.139, p.141"
    status: implement
  - id: IND-06
    name: "RSI 相对强弱"
    formula: "Wilder RSI(close, n)"
    params_ref: [rsi_period]
    inputs: [close]
    layer: "oscillator/screen2"
    rule: "LONG 时 RSI <= oversold，SHORT 时 RSI >= overbought。"
    confidence: A          # 公式 A；周期参数 B（二手称 7）
    source_ids: [S2, S5]
    source_quote: "Oscillators: Stochastic, rate of change, ... relative strength indicator, elder-ray, force index"
    book_confirmed: "第2版"
    book_edition: "《以交易为生》（原书第2版），[美]亚历山大·埃尔德（Alexander Elder）著，熊振华译，机械工业出版社 2017.6 第1版（2020.6 第8次印刷），ISBN 978-7-111-56972-5"
    book_chapter: ["第4章 计算机化的技术分析 · 第27节 相对强弱指标"]
    book_page: ["p.144", "p.145", "p.146"]
    book_quote: ["相对强弱指标（RSI）是由威尔斯·威尔德发明的一个震荡指标。", "交易信号在短期内的RSI上看得更清楚，比如7～9天的RSI。", "这些线通常是在30%和70%的地方。"]
    source_page: "p.144, p.145, p.146"
    status: implement
    note: "第2版差异：建议 RSI 7～9 日，另有 13 日示例；按用户决定保持 rsi_period=14，不改参数。"
  - id: IND-07
    name: "Williams %R"
    formula: "WR=-100*(HHV(high,n)-close)/(HHV(high,n)-LLV(low,n))"
    params_ref: []
    inputs: [high, low, close]
    layer: "oscillator/screen2"
    rule: "超买超卖 + 背离"
    confidence: B
    source_ids: [S5]
    source_quote: null
    source_page: null
    status: optional
    note: "unverified：无可核验短引，参数待核对"
  - id: IND-08
    name: "背离分类 A/B/C"
    formula: "A: price 新极值 & indicator 未新极值；B: 双顶/底 + indicator 走弱；C: indicator 持平"
    params_ref: []
    inputs: [price, indicator]
    layer: "oscillator/all"
    rule: "A 类为最强反转信号"
    confidence: B
    source_ids: [S5]
    source_quote: "Class A: when price reaches a new high/low, an oscillator reaches a lower high/higher bottom"
    book_confirmed: "第2版"
    book_edition: "《以交易为生》（原书第2版），[美]亚历山大·埃尔德（Alexander Elder）著，熊振华译，机械工业出版社 2017.6 第1版（2020.6 第8次印刷），ISBN 978-7-111-56972-5"
    book_chapter: ["第4章 计算机化的技术分析 · 第23节 MACD 线和 MACD 柱状线 · 背离"]
    book_page: ["p.127", "p.129"]
    book_quote: ["熊市背离显示出多方的能量在耗尽，价格还在惯性上涨，但空方已经准备入场接手。", "三重牛市或熊市背离由三组价格和震荡指标的底部或者三组价格和震荡指标的顶部组成。"]
    source_page: "p.127, p.129"
    status: optional
  - id: IND-09
    name: "成交量 Volume"
    formula: "volume"
    params_ref: []
    inputs: [volume]
    layer: "volume/verify"
    rule: "原始成交量透传，量价确认为 optional"
    confidence: A
    source_ids: [S1, S4]
    source_quote: "If the close is higher today than yesterday, the force is positive."
    book_confirmed: "第2版"
    book_edition: "《以交易为生》（原书第2版），[美]亚历山大·埃尔德（Alexander Elder）著，熊振华译，机械工业出版社 2017.6 第1版（2020.6 第8次印刷），ISBN 978-7-111-56972-5"
    book_chapter: ["第5章 成交量和时间 · 第30节 强力指数指标 · 「交易心理学」"]
    book_page: ["p.164"]
    book_quote: ["成交量反映了市场参与者的情绪卷入程度。"]
    source_page: "p.164"
    status: implement
  - id: IND-10
    name: "OBV 能量潮"
    formula: "OBV_t=OBV_{t-1} +/- volume_t"
    params_ref: []
